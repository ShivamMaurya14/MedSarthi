<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSarthi - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <span class="logo-icon">🏥</span>
            <h1
                style="font-size: 4.5rem; font-weight: 900; font-family: 'Inter', 'Outfit', sans-serif; letter-spacing: 2px; background: linear-gradient(135deg, var(--primary), var(--secondary)); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 5px 0;">
                MedSarthi</h1>
            <p>Welcome to the AI Healthcare Portal</p>
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('patient')">Patient Login</button>
            <button class="tab-btn" onclick="switchTab('doctor')">Doctor Login</button>
        </div>

        <!-- Patient Login Form -->
        <form id="patient-login-form" class="login-form active-form" onsubmit="handleLogin(event, 'patient')">
            <div class="input-group">
                <label for="patient-id">Patient ID</label>
                <input type="text" id="patient-id" value="P-889012" placeholder="e.g. P-889012" required>
            </div>
            <div class="input-group">
                <label for="patient-password">Password / OTP</label>
                <input type="password" id="patient-password" value="demo123" placeholder="••••••••" required>
            </div>
            <div style="font-size: 0.8rem; color: #64748B; margin-bottom: 15px;">Hint: Use <b>P-889012</b> &
                <b>demo123</b>
            </div>
            <button type="submit" class="submit-btn">Login as Patient</button>
        </form>

        <!-- Doctor Login Form -->
        <form id="doctor-login-form" class="login-form" onsubmit="handleLogin(event, 'doctor')">
            <div class="input-group">
                <label for="doctor-id">Doctor Registration ID</label>
                <input type="text" id="doctor-id" value="DR-5541" placeholder="e.g. DR-5541" required>
            </div>
            <div class="input-group">
                <label for="doctor-password">Password</label>
                <input type="password" id="doctor-password" value="doctor123" placeholder="••••••••" required>
            </div>
            <div style="font-size: 0.8rem; color: #64748B; margin-bottom: 15px;">Hint: Use <b>DR-5541</b> &
                <b>doctor123</b>
            </div>
            <button type="submit" class="submit-btn doctor-btn">Login as Doctor</button>
        </form>

    </div>

    <script src="login.js"></script>
</body>

</html>
