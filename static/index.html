<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDsarthi - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <span class="logo-icon">🏥</span>
            <h1>MEDsarthi</h1>
            <p>Welcome to the AI Healthcare Portal</p>
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('patient')">Patient Login</button>
            <button class="tab-btn" onclick="switchTab('doctor')">Doctor Login</button>
        </div>

        <!-- Patient Login Form -->
        <form id="patient-login-form" class="login-form active-form" onsubmit="handleLogin(event, 'patient')">
            <div class="input-group">
                <label for="patient-id">Patient ID</label>
                <input type="text" id="patient-id" placeholder="e.g. P-889012" required>
            </div>
            <div class="input-group">
                <label for="patient-password">Password / OTP</label>
                <input type="password" id="patient-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">Login as Patient</button>
        </form>

        <!-- Doctor Login Form -->
        <form id="doctor-login-form" class="login-form" onsubmit="handleLogin(event, 'doctor')">
            <div class="input-group">
                <label for="doctor-id">Doctor Registration ID</label>
                <input type="text" id="doctor-id" placeholder="e.g. DR-5541" required>
            </div>
            <div class="input-group">
                <label for="doctor-password">Password</label>
                <input type="password" id="doctor-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn doctor-btn">Login as Doctor</button>
        </form>

    </div>

    <script src="login.js"></script>
</body>

</html>
